<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الأدمن - بنك الأسئلة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>لوحة الأدمن</h1>
    <a href="login.html">صفحة الطلاب</a>
  </header>
  <main>
    <div class="card">
      <h2>رفع أسئلة من صورة</h2>
      <p class="muted">ارفع صورة ورقة أسئلة الدكتور، والذكاء الاصطناعي هيحوّلها لأسئلة ويحفظها في المادة اللي تختارها.</p>

      <label for="subject">المادة</label>
      <select id="subject"><option value="">جاري تحميل المواد...</option></select>

      <label for="image">صورة الأسئلة</label>
      <input id="image" type="file" accept="image/*">
      <img id="preview" class="preview" alt="معاينة الصورة">

      <button class="btn" id="uploadBtn">رفع وتحليل</button>
      <div id="msg" class="msg"></div>
    </div>
  </main>

  <script>
    const select = document.getElementById('subject');
    const fileInput = document.getElementById('image');
    const preview = document.getElementById('preview');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('uploadBtn');

    function show(text, type) {
      msg.textContent = text;
      msg.className = 'msg show ' + type;
    }

    async function loadSubjects() {
      try {
        const res = await fetch('/api/subjects');
        const subjects = await res.json();
        select.innerHTML = '';
        subjects.forEach(s => {
          const o = document.createElement('option');
          o.value = s.id;
          o.textContent = `${s.name} — ${s.section} (سنة ${s.year})`;
          select.appendChild(o);
        });
        if (!subjects.length) select.innerHTML = '<option value="">مفيش مواد</option>';
      } catch {
        select.innerHTML = '<option value="">تعذّر تحميل المواد</option>';
      }
    }

    fileInput.addEventListener('change', () => {
      const f = fileInput.files[0];
      if (!f) { preview.style.display = 'none'; return; }
      preview.src = URL.createObjectURL(f);
      preview.style.display = 'block';
    });

    btn.addEventListener('click', async () => {
      if (!select.value) return show('اختار المادة الأول.', 'error');
      if (!fileInput.files[0]) return show('اختار صورة الأسئلة.', 'error');

      const fd = new FormData();
      fd.append('subject_id', select.value);
      fd.append('image', fileInput.files[0]);

      btn.disabled = true;
      show('جاري التحليل، استنى شوية...', 'success');
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'حصل خطأ أثناء الرفع');
        show(`تم حفظ ${data.count ?? ''} سؤال بنجاح.`, 'success');
        fileInput.value = '';
        preview.style.display = 'none';
      } catch (err) {
        show(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    loadSubjects();
  </script>
</body>
</html>
