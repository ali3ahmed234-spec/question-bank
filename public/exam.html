<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الامتحان - بنك الأسئلة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">الامتحان</h1>
    <a href="selection.html">رجوع للمواد</a>
  </header>
  <main>
    <div id="msg" class="msg error"></div>
    <div id="questions"></div>
    <div id="result" class="card score" style="display:none"></div>
    <button class="btn" id="submitBtn" style="display:none">إنهاء وعرض النتيجة</button>
  </main>

  <script>
    const student = JSON.parse(localStorage.getItem('student') || 'null');
    if (!student) window.location.href = 'login.html';

    const params = new URLSearchParams(location.search);
    const subjectId = params.get('subject');
    const saved = JSON.parse(localStorage.getItem('subject') || 'null');
    if (saved && String(saved.id) === subjectId) {
      document.getElementById('title').textContent = 'امتحان ' + saved.name;
    }

    const msg = document.getElementById('msg');
    const container = document.getElementById('questions');
    const submitBtn = document.getElementById('submitBtn');
    let questions = [];

    // يرجّع رقم الإجابة الصحيحة (0-3) سواء جت كرقم أو حرف أو نص الاختيار
    function correctIndex(q) {
      const a = q.answer;
      if (typeof a === 'number') return a;
      if (/^\d+$/.test(String(a))) return Number(a);
      const letters = ['A', 'B', 'C', 'D'];
      const li = letters.indexOf(String(a).trim().toUpperCase());
      if (li !== -1) return li;
      return q.options.findIndex(o => o === a);
    }

    async function load() {
      try {
        const res = await fetch('/api/questions?subject_id=' + encodeURIComponent(subjectId));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'حصل خطأ');
        if (!data.length) throw new Error('مفيش أسئلة للمادة دي لسه.');
        questions = data;
        render();
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.add('show');
      }
    }

    function render() {
      container.innerHTML = '';
      questions.forEach((q, i) => {
        const card = document.createElement('div');
        card.className = 'card question';
        card.innerHTML = `<h3>${i + 1}. ${q.text}</h3>`;
        q.options.forEach((opt, j) => {
          const l = document.createElement('label');
          l.className = 'option';
          l.innerHTML = `<input type="radio" name="q${i}" value="${j}"> ${opt}`;
          card.appendChild(l);
        });
        container.appendChild(card);
      });
      submitBtn.style.display = 'inline-block';
    }

    submitBtn.addEventListener('click', () => {
      let score = 0;
      questions.forEach((q, i) => {
        const correct = correctIndex(q);
        const chosen = document.querySelector(`input[name="q${i}"]:checked`);
        const labels = container.children[i].querySelectorAll('.option');
        labels.forEach(l => l.querySelector('input').disabled = true);
        labels[correct]?.classList.add('correct');
        if (chosen) {
          if (Number(chosen.value) === correct) score++;
          else labels[Number(chosen.value)].classList.add('wrong');
        }
      });
      const result = document.getElementById('result');
      result.textContent = `نتيجتك: ${score} من ${questions.length}`;
      result.style.display = 'block';
      submitBtn.style.display = 'none';
      result.scrollIntoView({ behavior: 'smooth' });
    });

    load();
  </script>
</body>
</html>
