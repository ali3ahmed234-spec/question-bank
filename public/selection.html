<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختيار المادة - بنك الأسئلة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>بنك الأسئلة</h1>
    <div><span id="who"></span> — <button class="link" id="logout">خروج</button></div>
  </header>
  <main>
    <div class="card">
      <h2>اختار المادة</h2>

      <label for="year">السنة</label>
      <select id="year">
        <option value="1">الفرقة الأولى</option>
        <option value="2" selected>الفرقة الثانية</option>
        <option value="3">الفرقة الثالثة</option>
        <option value="4">الفرقة الرابعة</option>
      </select>

      <label for="section">التخصص</label>
      <select id="section">
        <option value="هندسة البرمجيات">هندسة البرمجيات</option>
        <option value="علوم الحاسب">علوم الحاسب</option>
        <option value="نظم المعلومات">نظم المعلومات</option>
      </select>

      <button class="btn" id="loadBtn">عرض المواد</button>
      <div id="msg" class="msg error"></div>
      <div id="subjects" class="subjects"></div>
    </div>
  </main>

  <script>
    const student = JSON.parse(localStorage.getItem('student') || 'null');
    if (!student) window.location.href = 'login.html';
    document.getElementById('who').textContent = student ? student.name : '';

    document.getElementById('logout').onclick = () => {
      localStorage.removeItem('student');
      window.location.href = 'login.html';
    };

    const msg = document.getElementById('msg');
    const box = document.getElementById('subjects');

    document.getElementById('loadBtn').addEventListener('click', async () => {
      msg.classList.remove('show');
      box.innerHTML = '';
      const year = document.getElementById('year').value;
      const section = document.getElementById('section').value;
      try {
        const res = await fetch(`/api/subjects?year=${encodeURIComponent(year)}&section=${encodeURIComponent(section)}`);
        const subjects = await res.json();
        if (!res.ok) throw new Error(subjects.error || 'حصل خطأ');
        if (!subjects.length) {
          msg.textContent = 'مفيش مواد متاحة للسنة والتخصص دول.';
          msg.classList.add('show');
          return;
        }
        subjects.forEach(s => {
          const b = document.createElement('button');
          b.className = 'subject-btn';
          b.textContent = s.name;
          b.onclick = () => {
            localStorage.setItem('subject', JSON.stringify(s));
            window.location.href = 'exam.html?subject=' + s.id;
          };
          box.appendChild(b);
        });
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.add('show');
      }
    });
  </script>
</body>
</html>
